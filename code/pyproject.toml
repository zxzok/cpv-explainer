[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "counterfactual-temporal-protocols"
version = "1.0.0"
description = "Counterfactual evaluation, calibration, and design of temporal observation protocols"
readme = "README.md"
requires-python = ">=3.11,<3.15"
authors = [{name = "Xizhe Zhang"}]
dependencies = [
  "numpy==2.5.1",
  "scipy==1.18.0",
  "matplotlib==3.11.1",
  "wfdb==4.3.1",
  "mne==1.12.1",
  "xlrd==2.0.2",
  "requests==2.34.2",
]

[tool.setuptools.packages.find]
include = ["protocol_ceiling*"]

